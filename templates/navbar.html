<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>👨‍💼 Employee Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: 0.5s;
        }

        /* =========================
           🌞 LIGHT THEME
        ========================= */

        body.light {
            background:
                radial-gradient(circle at top left, #ffe0f0, transparent 35%),
                radial-gradient(circle at bottom right, #c7f9ff, transparent 35%),
                linear-gradient(135deg, #f8f9ff, #e8faff);

            color: #222;
        }

        body.light .content p {
            color: #555;
        }

        /* =========================
           🌙 DARK THEME
        ========================= */

        body.dark {
            background:
                radial-gradient(circle at top left, #35145c, transparent 35%),
                radial-gradient(circle at bottom right, #003b46, transparent 35%),
                linear-gradient(135deg, #080018, #101828);

            color: white;
        }

        body.dark .content p {
            color: #ddd;
        }

        /* =========================
           🧭 NAVBAR
        ========================= */

        .navbar {
            position: sticky;
            top: 15px;
            z-index: 100;

            width: 94%;
            margin: 15px auto;

            display: flex;
            align-items: center;

            padding: 18px 25px;

            background: rgba(20, 20, 35, 0.85);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);

            flex-wrap: wrap;
            gap: 15px;
        }

        /* =========================
           👨‍💼 LOGO
        ========================= */

        .logo {
            color: white;

            font-size: 24px;
            font-weight: bold;

            text-shadow:
                0 0 5px #00e5ff,
                0 0 15px #00e5ff;

            transform:
                perspective(500px)
                rotateX(5deg);

            transition: 0.3s;
        }

        .logo:hover {
            transform:
                perspective(500px)
                rotateX(0deg)
                translateY(-3px);

            text-shadow:
                0 0 10px #ff00cc,
                0 0 25px #00e5ff;
        }

        /* =========================
           🌈 THEME BUTTONS
        ========================= */

        .theme-buttons {
            display: flex;
            gap: 10px;
            margin-left: 20px;
        }

        .theme-buttons a {
            color: white;
            text-decoration: none;

            padding: 9px 14px;

            border-radius: 12px;

            border: 1px solid rgba(255, 255, 255, 0.3);

            background:
                linear-gradient(
                    145deg,
                    #292945,
                    #151525
                );

            box-shadow:
                5px 5px 10px rgba(0, 0, 0, 0.4),
                -3px -3px 8px rgba(255, 255, 255, 0.08);

            transition: 0.3s;
        }

        .theme-buttons a:hover {
            transform:
                translateY(-4px)
                scale(1.05);

            background:
                linear-gradient(
                    135deg,
                    #ff00cc,
                    #3333ff
                );

            box-shadow:
                0 8px 20px rgba(255, 0, 204, 0.4);
        }

        /* =========================
           🔗 NAV LINKS
        ========================= */

        .nav-links {
            display: flex;
            align-items: center;

            list-style: none;

            margin-left: auto;

            gap: 8px;

            flex-wrap: wrap;
        }

        .nav-links li a {
            display: block;

            color: white;

            text-decoration: none;

            font-size: 15px;

            padding: 10px 13px;

            border-radius: 12px;

            transition: 0.3s;

            position: relative;
        }

        .nav-links li a::before {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 3px;

            width: 0;
            height: 2px;

            background: #00e5ff;

            transition: 0.3s;

            transform: translateX(-50%);
        }

        .nav-links li a:hover::before {
            width: 70%;
        }

        .nav-links li a:hover {
            transform: translateY(-3px);

            background: rgba(255, 255, 255, 0.1);

            box-shadow:
                0 8px 20px rgba(0, 229, 255, 0.2);
        }

        /* =========================
           📝 REGISTER BUTTON
        ========================= */

        .register-btn {
            background:
                linear-gradient(
                    135deg,
                    #ff00cc,
                    #3333ff
                ) !important;

            box-shadow:
                0 5px 15px rgba(255, 0, 204, 0.4);

            font-weight: bold;
        }

        .register-btn:hover {
            transform:
                translateY(-5px)
                scale(1.06) !important;

            box-shadow:
                0 12px 25px rgba(51, 51, 255, 0.5);
        }

        /* =========================
           🔍 SEARCH BUTTON
        ========================= */

        .search-btn {
            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff
                ) !important;

            box-shadow:
                0 5px 15px rgba(0, 114, 255, 0.4);

            font-weight: bold;
        }

        .search-btn:hover {
            transform:
                translateY(-5px)
                scale(1.06) !important;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #3333ff
                ) !important;

            box-shadow:
                0 12px 25px rgba(0, 229, 255, 0.5);
        }

        /* =========================
           🏠 MAIN CONTENT
        ========================= */

        .content {
            width: 90%;
            max-width: 900px;

            margin: 100px auto;

            text-align: center;

            padding: 60px 30px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.15),
                    rgba(255, 255, 255, 0.03)
                );

            backdrop-filter: blur(20px);

            border:
                1px solid rgba(255, 255, 255, 0.2);

            box-shadow:
                15px 15px 40px rgba(0, 0, 0, 0.25),
                inset -5px -5px 15px rgba(0, 0, 0, 0.1),
                inset 5px 5px 15px rgba(255, 255, 255, 0.08);

            transform:
                perspective(1000px)
                rotateX(2deg);

            transition: 0.5s;
        }

        .content:hover {
            transform:
                perspective(1000px)
                rotateX(0deg)
                translateY(-8px);

            box-shadow:
                20px 25px 50px rgba(0, 0, 0, 0.3);
        }

        /* =========================
           ✨ HEADING
        ========================= */

        .content h1 {
            font-size: clamp(28px, 5vw, 48px);

            margin-bottom: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ff00cc,
                    #00e5ff,
                    #7cff00,
                    #ff00cc
                );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            animation:
                gradientText 5s linear infinite;

            text-shadow:
                0 0 20px rgba(0, 229, 255, 0.2);
        }

        @keyframes gradientText {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        /* =========================
           💬 DESCRIPTION
        ========================= */

        .content p {
            font-size: 20px;

            margin-bottom: 30px;

            letter-spacing: 1px;
        }

        /* =========================
           🚀 3D BUTTON
        ========================= */

        .start-btn {
            display: inline-block;

            padding: 15px 30px;

            color: white;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff
                );

            box-shadow:
                0 8px 0 #004bb5,
                0 15px 25px rgba(0, 114, 255, 0.4);

            transition: 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-5px);

            box-shadow:
                0 13px 0 #004bb5,
                0 20px 30px rgba(0, 114, 255, 0.5);
        }

        .start-btn:active {
            transform: translateY(5px);

            box-shadow:
                0 3px 0 #004bb5,
                0 8px 15px rgba(0, 114, 255, 0.3);
        }

        /* =========================
           🔵 FLOATING CIRCLES
        ========================= */

        .shape {
            position: fixed;

            border-radius: 50%;

            filter: blur(1px);

            opacity: 0.5;

            pointer-events: none;

            z-index: -1;
        }

        .shape.one {
            width: 180px;
            height: 180px;

            background: #ff00cc;

            top: 20%;
            left: 5%;

            animation:
                floatOne 7s ease-in-out infinite;
        }

        .shape.two {
            width: 130px;
            height: 130px;

            background: #00e5ff;

            right: 5%;
            bottom: 15%;

            animation:
                floatTwo 6s ease-in-out infinite;
        }

        .shape.three {
            width: 90px;
            height: 90px;

            background: #7cff00;

            top: 60%;
            left: 45%;

            animation:
                floatThree 5s ease-in-out infinite;
        }

        @keyframes floatOne {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -40px);
            }
        }

        @keyframes floatTwo {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-30px, 30px);
            }
        }

        @keyframes floatThree {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-50px);
            }
        }

        /* =========================
           📱 RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .navbar {
                justify-content: center;
            }

            .logo {
                width: 100%;
                text-align: center;
            }

            .theme-buttons {
                margin-left: 0;
            }

            .nav-links {
                margin-left: 0;
                justify-content: center;
            }
        }

        @media (max-width: 600px) {

            .navbar {
                width: 96%;
                padding: 15px;
            }

            .logo {
                font-size: 20px;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links li a {
                width: 100%;
                text-align: center;
            }

            .content {
                margin-top: 60px;
                padding: 45px 20px;
            }
        }

    </style>
</head>

<body class="{{ theme }}">

    <!-- ✨ Floating 3D Shapes -->

    <div class="shape one"></div>
    <div class="shape two"></div>
    <div class="shape three"></div>


    <!-- 🧭 NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            👨‍💼 Employee Management System
        </div>


        <!-- 🌞🌙 Theme Buttons -->

        <div class="theme-buttons">

            <a href="/set-theme/light">
                ☀️ Light
            </a>

            <a href="/set-theme/dark">
                🌙 Dark
            </a>

        </div>


        <!-- 🔗 Navigation -->

        <ul class="nav-links">

            <li>
                <a href="/home">
                    🏠 Home
                </a>
            </li>

            <li>
                <a href="/employees">
                    👥 Employees
                </a>
            </li>

            <li>
                <a href="/add-employee">
                    ➕ Add Employee
                </a>
            </li>

            <li>
                <a href="/register" class="register-btn">
                    📝 Register
                </a>
            </li>

            <!-- 🔍 NEW SEARCH BUTTON -->

            <li>
                <a href="/search-employee" class="search-btn">
                    🔍 Search
                </a>
            </li>

            <li>
                <a href="/logout">
                    🚪 Logout
                </a>
            </li>

        </ul>

    </nav>


    <!-- 🏠 MAIN CONTENT -->

    <div class="content">

        <h1>
            👋 Welcome to Employee Management System
        </h1>

        <p>
            🚀 Manage your employees easily, quickly & efficiently!
        </p>

        <a href="/employees" class="start-btn">
            👥 View Employees
        </a>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>✏️ Edit Employee</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            padding: 40px 15px;

            transition: 0.4s;

            background:
                radial-gradient(circle at top left, #ffd1ef, transparent 35%),
                radial-gradient(circle at bottom right, #b9f5ff, transparent 35%),
                linear-gradient(135deg, #eef5ff, #fff0fa);
        }


        /* ================= LIGHT THEME ================= */

        body.light {
            color: #222;
        }


        /* ================= DARK THEME ================= */

        body.dark {

            color: white;

            background:
                radial-gradient(circle at top left, #4c176b, transparent 35%),
                radial-gradient(circle at bottom right, #004b58, transparent 35%),
                linear-gradient(135deg, #080018, #111827);
        }


        /* ================= MAIN CONTAINER ================= */

        #container {

            width: 500px;

            max-width: 100%;

            margin: auto;

            padding: 30px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.5);

            box-shadow:
                15px 15px 35px rgba(0, 0, 0, 0.20),
                -8px -8px 25px rgba(255, 255, 255, 0.75);

            transform:
                perspective(1000px)
                rotateX(2deg);

            transition: 0.4s;
        }


        #container:hover {

            transform:
                perspective(1000px)
                rotateX(0deg)
                translateY(-6px);

            box-shadow:
                20px 25px 50px rgba(0, 0, 0, 0.28);
        }


        /* ================= DARK CONTAINER ================= */

        body.dark #container {

            background: rgba(30, 30, 45, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                15px 15px 40px rgba(0, 0, 0, 0.65),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
        }


        /* ================= HEADING ================= */

        h1 {

            text-align: center;

            margin-bottom: 25px;

            font-size: 30px;

            background:
                linear-gradient(
                    90deg,
                    #ff00cc,
                    #3333ff,
                    #00c6ff,
                    #00e676,
                    #ff00cc
                );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text ;

            -webkit-text-fill-color: transparent;

            animation: gradientText 5s linear infinite;
        }


        @keyframes gradientText {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }


        /* ================= THEME BUTTONS ================= */

        .theme-buttons {

            display: flex;

            justify-content: center;

            gap: 12px;

            margin-bottom: 25px;
        }


        .theme-buttons a {

            padding: 10px 18px;

            text-decoration: none;

            color: white;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            box-shadow:
                0 5px 0 #4c3475,
                0 10px 20px rgba(102, 126, 234, 0.35);

            transition: 0.2s;
        }


        .theme-buttons a:hover {

            transform: translateY(-4px);

            box-shadow:
                0 9px 0 #4c3475,
                0 15px 25px rgba(102, 126, 234, 0.5);
        }


        .theme-buttons a:active {

            transform: translateY(3px);
        }


        /* ================= FORM ================= */

        form {
            width: 100%;
        }


        form > div {

            margin-bottom: 17px;
        }


        /* ================= LABEL ================= */

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 15px;
        }


        /* ================= INPUTS ================= */

        input,
        textarea {

            width: 100%;

            padding: 12px 14px;

            border: 2px solid #ddd;

            border-radius: 12px;

            font-size: 14px;

            outline: none;

            background: rgba(255, 255, 255, 0.9);

            transition: 0.3s;

            box-shadow:
                inset 3px 3px 7px rgba(0, 0, 0, 0.08);
        }


        /* ================= INPUT FOCUS ================= */

        input:focus,
        textarea:focus {

            border-color: #7b61ff;

            transform: translateY(-2px);

            box-shadow:
                0 0 0 3px rgba(123, 97, 255, 0.15),
                0 8px 18px rgba(123, 97, 255, 0.18);
        }


        /* ================= DARK INPUTS ================= */

        body.dark input,
        body.dark textarea {

            background: #292938;

            color: white;

            border-color: #555;
        }


        body.dark input:focus,
        body.dark textarea:focus {

            border-color: #00e5ff;

            box-shadow:
                0 0 0 3px rgba(0, 229, 255, 0.12),
                0 8px 18px rgba(0, 229, 255, 0.15);
        }


        /* ================= TEXTAREA ================= */

        textarea {

            resize: vertical;

            min-height: 110px;
        }


        /* ================= BUTTON AREA ================= */

        .button {

            display: flex;

            gap: 15px;

            margin-top: 25px;
        }


        /* ================= BUTTON ================= */

        button {

            flex: 1;

            padding: 13px 20px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            color: white;

            transition: 0.2s;
        }


        /* ================= UPDATE BUTTON ================= */

        .update-btn {

            background:
                linear-gradient(
                    135deg,
                    #007bff,
                    #00c6ff
                );

            box-shadow:
                0 6px 0 #0056b3,
                0 12px 20px rgba(0, 123, 255, 0.35);
        }


        .update-btn:hover {

            transform: translateY(-5px);

            box-shadow:
                0 11px 0 #0056b3,
                0 18px 28px rgba(0, 123, 255, 0.45);
        }


        /* ================= RESET BUTTON ================= */

        .reset-btn {

            background:
                linear-gradient(
                    135deg,
                    #ff416c,
                    #ff4b2b
                );

            box-shadow:
                0 6px 0 #b52a20,
                0 12px 20px rgba(255, 65, 108, 0.35);
        }


        .reset-btn:hover {

            transform: translateY(-5px);

            box-shadow:
                0 11px 0 #b52a20,
                0 18px 28px rgba(255, 65, 108, 0.45);
        }


        button:active {

            transform: translateY(4px);
        }


        /* ================= FLOATING BACKGROUND ================= */

        body::before {

            content: "";

            position: fixed;

            width: 180px;

            height: 180px;

            border-radius: 50%;

            background: #ff00cc;

            opacity: 0.18;

            filter: blur(5px);

            top: 8%;

            left: 4%;

            z-index: -1;

            animation: floatOne 6s ease-in-out infinite;
        }


        body::after {

            content: "";

            position: fixed;

            width: 150px;

            height: 150px;

            border-radius: 50%;

            background: #00e5ff;

            opacity: 0.2;

            filter: blur(5px);

            bottom: 8%;

            right: 5%;

            z-index: -1;

            animation: floatTwo 7s ease-in-out infinite;
        }


        @keyframes floatOne {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -35px);
            }
        }


        @keyframes floatTwo {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-30px, 30px);
            }
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            #container {
                width: 95%;
                padding: 22px 18px;
            }

            h1 {
                font-size: 26px;
            }

            .button {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

    </style>

</head>


<body class="{{theme}}">

    <div id="container">

        <!-- ✏️ TITLE -->

        <h1>
            ✏️ Edit Employee
        </h1>


        <!-- ☀️🌙 THEME -->

        <nav>

            <div class="theme-buttons">

                <a href="/set-theme/light">
                    ☀️ Light
                </a>

                <a href="/set-theme/dark">
                    🌙 Dark
                </a>

            </div>

        </nav>


        <!-- 📝 FORM -->

        <form
            action="/edit-employee/{{ employee['id'] }}"
            method="POST"
        >


            <!-- 👤 NAME -->

            <div>

                <label>
                    👤 Name:
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ employee['name'] }}"
                    required
                >

            </div>


            <!-- 📧 EMAIL -->

            <div>

                <label>
                    📧 Email:
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ employee['email'] }}"
                    required
                >

            </div>


            <!-- 📱 PHONE -->

            <div>

                <label>
                    📱 Phone:
                </label>

                <input
                    type="tel"
                    name="phone"
                    value="{{ employee['phone'] }}"
                    required
                >

            </div>


            <!-- 🏢 DEPARTMENT -->

            <div>

                <label>
                    🏢 Department:
                </label>

                <input
                    type="text"
                    name="department"
                    value="{{ employee['department'] }}"
                    required
                >

            </div>


            <!-- 💰 SALARY -->

            <div>

                <label>
                    💰 Salary:
                </label>

                <input
                    type="number"
                    name="salary"
                    value="{{ employee['salary'] }}"
                    required
                >

            </div>


            <!-- 📅 JOINING DATE -->

            <div>

                <label>
                    📅 Joining Date:
                </label>

                <input
                    type="date"
                    name="joiningdate"
                    value="{{ employee['joiningdate'] }}"
                    required
                >

            </div>


            <!-- 🏠 ADDRESS -->

            <div>

                <label>
                    🏠 Address:
                </label>

                <textarea
                    name="address"
                    required
                >{{ employee['address'] }}</textarea>

            </div>


            <!-- 🔘 BUTTONS -->

            <div class="button">

                <button
                    type="submit"
                    class="update-btn"
                >
                    ✏️ Update Employee
                </button>


                <button
                    type="reset"
                    class="reset-btn"
                >
                    🔄 Reset
                </button>

            </div>


        </form>

    </div>

</body>

</html>

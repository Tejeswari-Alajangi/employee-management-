
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>➕ Add Employee</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 15px;

            transition: 0.4s;

            background:
                radial-gradient(circle at top left, #ffb6e6, transparent 35%),
                radial-gradient(circle at bottom right, #9eeaff, transparent 35%),
                linear-gradient(135deg, #eef7ff, #fdf1ff);
        }

        /* =========================
           🌞 LIGHT THEME
        ========================= */

        body.light {
            color: #222;
        }

        /* =========================
           🌙 DARK THEME
        ========================= */

        body.dark {
            color: white;

            background:
                radial-gradient(circle at top left, #4b176d, transparent 35%),
                radial-gradient(circle at bottom right, #004e5c, transparent 35%),
                linear-gradient(135deg, #080018, #111827);
        }

        /* =========================
           📦 MAIN CONTAINER
        ========================= */

        #container {
            width: 500px;
            max-width: 100%;

            margin: 20px auto;

            padding: 30px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.75);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.5);

            box-shadow:
                15px 15px 35px rgba(0, 0, 0, 0.2),
                -8px -8px 25px rgba(255, 255, 255, 0.7);

            transform: perspective(1000px) rotateX(2deg);

            transition: 0.4s;
        }

        #container:hover {
            transform:
                perspective(1000px)
                rotateX(0deg)
                translateY(-6px);

            box-shadow:
                20px 25px 50px rgba(0, 0, 0, 0.25);
        }

        /* 🌙 DARK CONTAINER */

        body.dark #container {
            background: rgba(30, 30, 45, 0.85);

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                15px 15px 40px rgba(0, 0, 0, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
        }

        /* =========================
           📝 HEADING
        ========================= */

        h2 {
            text-align: center;

            margin-bottom: 25px;

            font-size: 30px;

            background:
                linear-gradient(
                    90deg,
                    #ff00cc,
                    #3333ff,
                    #00c6ff,
                    #ff00cc
                );

            background-size: 300%;

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: headingColor 5s linear infinite;
        }

        @keyframes headingColor {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }

        }

        /* =========================
           ☀️🌙 THEME BUTTONS
        ========================= */

        .theme-buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-bottom: 25px;
        }

        .theme-buttons a {
            padding: 10px 18px;

            text-decoration: none;

            color: white;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            box-shadow:
                0 5px 0 #4b3575,
                0 10px 20px rgba(102, 126, 234, 0.35);

            transition: 0.2s;
        }

        .theme-buttons a:hover {
            transform: translateY(-4px);

            box-shadow:
                0 9px 0 #4b3575,
                0 15px 25px rgba(102, 126, 234, 0.5);
        }

        .theme-buttons a:active {
            transform: translateY(3px);
        }

        /* =========================
           📋 FORM ROW
        ========================= */

        .row {
            margin-bottom: 17px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        label {
            margin-bottom: 7px;

            font-weight: bold;

            font-size: 15px;
        }

        /* =========================
           ✏️ INPUTS
        ========================= */

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px 14px;

            border: 2px solid #ddd;

            border-radius: 12px;

            font-size: 14px;

            outline: none;

            background: rgba(255, 255, 255, 0.9);

            transition: 0.3s;

            box-shadow:
                inset 3px 3px 7px rgba(0, 0, 0, 0.08);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #7b61ff;

            transform: translateY(-2px);

            box-shadow:
                0 0 0 3px rgba(123, 97, 255, 0.15),
                0 8px 18px rgba(123, 97, 255, 0.15);
        }

        input::placeholder,
        textarea::placeholder {
            color: #999;
        }

        /* 🌙 DARK INPUTS */

        body.dark input,
        body.dark select,
        body.dark textarea {
            background: #292938;

            color: white;

            border-color: #555;
        }

        body.dark input::placeholder,
        body.dark textarea::placeholder {
            color: #aaa;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* =========================
           🔘 BUTTONS
        ========================= */

        .button {
            display: flex;

            gap: 15px;

            margin-top: 25px;
        }

        button {
            flex: 1;

            padding: 13px 20px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            color: white;

            transition: 0.2s;
        }

        /* ➕ ADD */

        .add-btn {
            background:
                linear-gradient(
                    135deg,
                    #00c853,
                    #00a152
                );

            box-shadow:
                0 6px 0 #087a3b,
                0 12px 20px rgba(0, 200, 83, 0.3);
        }

        .add-btn:hover {
            transform: translateY(-5px);

            box-shadow:
                0 11px 0 #087a3b,
                0 18px 25px rgba(0, 200, 83, 0.4);
        }

        /* 🔄 RESET */

        .reset-btn {
            background:
                linear-gradient(
                    135deg,
                    #ff416c,
                    #ff4b2b
                );

            box-shadow:
                0 6px 0 #b82b20,
                0 12px 20px rgba(255, 65, 108, 0.3);
        }

        .reset-btn:hover {
            transform: translateY(-5px);

            box-shadow:
                0 11px 0 #b82b20,
                0 18px 25px rgba(255, 65, 108, 0.4);
        }

        button:active {
            transform: translateY(4px);
        }

        /* =========================
           ✨ FLOATING BACKGROUND
        ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: #ff00cc;

            opacity: 0.18;

            filter: blur(5px);

            top: 10%;
            left: 5%;

            z-index: -1;

            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: "";

            position: fixed;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            background: #00e5ff;

            opacity: 0.2;

            filter: blur(5px);

            bottom: 10%;
            right: 5%;

            z-index: -1;

            animation: float 7s ease-in-out infinite reverse;
        }

        @keyframes float {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -35px);
            }

        }

        /* =========================
           📱 RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;
            }

            #container {
                padding: 22px 18px;
                margin: 10px auto;
            }

            h2 {
                font-size: 25px;
            }

            .button {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

        }

    </style>
</head>

<body class="{{ theme }}">

    <div id="container">

        <!-- 👨‍💼 TITLE -->

        <h2>
            👨‍💼 Add Employee
        </h2>

        <!-- ☀️🌙 THEME -->

        <nav>
            <div class="theme-buttons">

                <a href="/set-theme/light">
                    ☀️ Light
                </a>

                <a href="/set-theme/dark">
                    🌙 Dark
                </a>

            </div>
        </nav>


        <!-- 📝 FORM -->

        <form action="/add-employee" method="POST">

            <!-- 👤 NAME -->

            <div class="row">
                <div class="form-group">

                    <label for="name">
                        👤 Employee Name:
                    </label>

                    <input
                        type="text"
                        name="name"
                        id="name"
                        placeholder="Enter employee name"
                    >

                </div>
            </div>


            <!-- 📧 EMAIL -->

            <div class="row">
                <div class="form-group">

                    <label for="email">
                        📧 Email:
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Enter email"
                    >

                </div>
            </div>


            <!-- 📱 PHONE -->

            <div class="row">
                <div class="form-group">

                    <label for="phone">
                        📱 Phone Number:
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>
            </div>


            <!-- 🏢 DEPARTMENT -->

            <div class="row">
                <div class="form-group">

                    <label for="department">
                        🏢 Department:
                    </label>

                    <select
                        name="department"
                        id="department"
                    >

                        <option value="">
                            🔽 Select Department
                        </option>

                        <option value="IT">
                            💻 IT
                        </option>

                        <option value="sales">
                            📈 Sales
                        </option>

                        <option value="HR">
                            👥 HR
                        </option>

                        <option value="finance">
                            💰 Finance
                        </option>

                        <option value="manager">
                            👔 Manager
                        </option>

                    </select>

                </div>
            </div>


            <!-- 💰 SALARY -->

            <div class="row">
                <div class="form-group">

                    <label for="salary">
                        💰 Salary:
                    </label>

                    <input
                        type="number"
                        name="salary"
                        id="salary"
                        placeholder="Enter salary"
                    >

                </div>
            </div>


            <!-- 📅 JOINING DATE -->

            <div class="row">
                <div class="form-group">

                    <label for="joiningdate">
                        📅 Joining Date:
                    </label>

                    <input
                        type="date"
                        name="joiningdate"
                        id="joiningdate"
                    >

                </div>
            </div>


            <!-- 🏠 ADDRESS -->

            <div class="row">
                <div class="form-group">

                    <label for="address">
                        🏠 Address:
                    </label>

                    <textarea
                        name="address"
                        id="address"
                        rows="4"
                        placeholder="Enter address"
                    ></textarea>

                </div>
            </div>


            <!-- 🚀 BUTTONS -->

            <div class="button">

                <button
                    type="submit"
                    class="add-btn"
                >
                    ➕ Add Employee
                </button>

                <button
                    type="reset"
                    class="reset-btn"
                >
                    🔄 Reset
                </button>

            </div>

        </form>

    </div>

</body>
</html>
